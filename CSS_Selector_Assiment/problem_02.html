<!DOCTYPE html>
<html>
<head>
<title>Rooms & Suites</title>
<style>
*{box-sizing:border-box}
body{text-align:center;margin:30px}
#rooms{display:flex;justify-content:center;gap:20px}
.room{
width:30%;
padding-bottom:15px;
box-shadow:0 2px 8px gray
}
.room img{width:100%;height:180px;object-fit:cover}
h2{margin:10px}
p{color:gray}
.price{font-weight:bold}
</style>
</head>

<body>

<h1>Rooms & Suits</h1>
<p>Choose a comfortable room for your stay.</p>

<div id="rooms">

<div class="room">
<img src="https://images.unsplash.com/photo-1566665797739-1674de7a421a">
<h2>Single Room</h2>
<p class="price">$90 / PER NIGHT</p>
</div>

<div class="room">
<img src="https://images.unsplash.com/photo-1582719478250-c89cae4dc85b">
<h2>Family Room</h2>
<p class="price">$120 / PER NIGHT</p>
</div>

<div class="room">
<img src="https://images.unsplash.com/photo-1618773928121-c32242e63f39">
<h2>Presidential Room</h2>
<p class="price">$250 / PER NIGHT</p>
</div>

</div>
</body>
</html>
