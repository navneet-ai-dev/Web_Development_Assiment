<!DOCTYPE html>
<html>
<head>
<title>Periodic Table</title>

<style>
*{
    box-sizing:border-box;
}

body{
    text-align:center;
    font-family:Arial;
}

.table{
    display:grid;
    grid-template-columns:repeat(18,32px);
    gap:9px;
    width:max-content;
    margin:auto;
}

.box{
    width:32px;
    height:32px;
    border:1px solid grey;
    background:green;
    text-align:center;
    padding-top:7px;
}

.red{background:red}
.blue{background:blue}
.orange{background:orange}
.purple{background:purple}
.pink{background:red}
.yellow{background:yellow}
.grey{background:grey}
.white{background:white;border:3px solid black}

#h{
    background:red;
    color:white;
    font-size:20px;
    padding-top:5px;
}

#si{
    grid-column:4 / 7;
    grid-row:1 / 4;
    width:105px;
    height:105px;
    background:greenyellow;
    text-align:left;
    padding:8px;
}

#si b{
    font-size:40px;
    font-weight:normal;
}

.bottom{
    margin:40px auto;
    width:375px;
}

.bottom div{
    display:flex;
}

.bottom span{
    width:25px;
    height:27px;
    border:1px solid dark green;
}

.lan span{background:green}
.act span{background:dark green}
</style>
</head>

<body>

<h2>THE PERIODIC TABLE OF ELEMENTS</h2>

<div class="table">

<div id="h" style="grid-column:1;grid-row:1">H</div>

</body>
</html>
