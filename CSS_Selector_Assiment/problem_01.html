<!DOCTYPE html>
<html>
<head>
<title>Movie Listing</title>
<style>
*{box-sizing:border-box}
body{margin:25px}
#movies{text-align:center}
.movie{
display:inline-block;
vertical-align:top;
width:47%;
height:145px;
margin:8px;
border:1px solid pink;
text-align:left
}
.movie img{
width:145px;
height:143px;
object-fit:cover;
vertical-align:top
}
.info{
display:inline-block;
padding:10px;
vertical-align:top
}
h2,p{margin:0 0 12px}
h2{font-size:16px}
p{font-size:13px}
button{
background:red;
color:white;
border:0;
border-radius:7px;
padding:7px 12px
}
</style>
</head>

<body>
<div id="movies">

<div class="movie">
<img src="https://www.impawards.com/intl/india/2022/posters/jhund.jpg">
<div class="info"><h2>Jhund</h2>
<p>Releasing on 11 Mar, 2022</p><button>Book tickets</button></div>
</div>

</div>
<br/>

<div class="movie">

</html>
