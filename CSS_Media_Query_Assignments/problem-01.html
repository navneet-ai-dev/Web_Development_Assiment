<!DOCTYPE html>
<html>
<head>
<title>Media Query</title>

<style>
body{
  margin:30px;
  font-family:Arial;
}

.nav{
  background:yellow;
  padding:10px;
  font-size:25px;
}

.boxes{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:15px;
  margin-top:10px;
}

.box{
  padding:60px 10px;
  color:#333;
}

.box1{background:red;}
.box2{background:#00ff33;}
.box3{background:#5964e8;}
.box4{background:#aaa;}

@media(max-width:800px){
  .boxes{
    grid-template-columns:repeat(2,1fr);
  }
}

@media(max-width:500px){
  .boxes{
    grid-template-columns:1fr;
  }
}
</style>
</head>

<body>

<div class="nav">Navigation</div>

<div class="boxes">
  <div class="box box1">Box 1</div>
  <div class="box box2">Box 2</div>
  <div class="box box3">Box 3</div>
  <div class="box box4">Box 4</div>
</div>

</body>
</html>
