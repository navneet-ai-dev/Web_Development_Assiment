<!DOCTYPE html>
<html>
<head>
<title>Keyboard</title>

<style>
body{
  background:#09b6cc;
  padding:50px;
}

.keyboard{
  display:grid;
  grid-template-columns:repeat(12,1fr);
  gap:8px;
  background:#222;
  padding:20px;
}

button{
  padding:12px;
  background:#333;
  color:#0bb;
  border:0;
}

.space{
  grid-column:span 5;
}
</style>
</head>

<body>

<div class="keyboard">

<button>~</button><button>1</button><button>2</button>
<button>3</button><button>4</button><button>5</button>
<button>6</button><button>7</button><button>8</button>
<button>9</button><button>0</button><button>delete</button>

<button>tab</button><button>Q</button><button>W</button>
<button>E</button><button>R</button><button>T</button>
<button>Y</button><button>U</button><button>I</button>
<button>O</button><button>P</button><button>\</button>

<button>caps</button><button>A</button><button>S</button>
<button>D</button><button>F</button><button>G</button>
<button>H</button><button>J</button><button>K</button>
<button>L</button><button>Enter</button>

<button>shift</button><button>Z</button><button>X</button>
<button>C</button><button>V</button><button>B</button>
<button>N</button><button>M</button><button>Shift</button>

<button>Ctrl</button>
<button>Alt</button>
<button class="space">Space</button>
<button>Alt</button>
<button>←</button><button>→</button>

</div>

</body>
</html>
