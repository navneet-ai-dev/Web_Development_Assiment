<!DOCTYPE html>
<html>
<head>
<title>Grid Layout</title>

<style>
.main{
  display:grid;
  grid-template-columns:1fr 2fr 1fr;
  grid-template-rows:1fr 1fr 1fr;
  gap:20px;
  grid-template-areas:
  "a b c"
  "d d e"
  "f g h";
}

.box{
  background:#27806d;
  border-radius:5px;
}

.a{grid-area:a;}
.b{grid-area:b;}
.c{grid-area:c;}
.d{grid-area:d;}
.e{grid-area:e;}
.f{grid-area:f;}
.g{grid-area:g;}
.h{grid-area:h;}
</style>
</head>

<body>

<div class="main">
<div class="box a"></div>
<div class="box b"></div>
<div class="box c"></div>
<div class="box d"></div>
<div class="box e"></div>
<div class="box f"></div>
<div class="box g"></div>
<div class="box h"></div>
</div>

</body>
</html>
