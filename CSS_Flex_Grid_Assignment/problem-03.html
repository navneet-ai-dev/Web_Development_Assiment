<!DOCTYPE html>
<html>
<head>
<title>Grid Area</title>

<style>
.main{
  display:grid;
  grid-template-columns:2fr 1fr 1fr;
  gap:12px;
  grid-template-areas:
  "a b e"
  "c b e"
  "d b e";
}

.box{
  background:#444;
  color:white;
  padding:35px;
  font-size:25px;
}

.a{grid-area:a;}
.b{grid-area:b;}
.c{grid-area:c;}
.d{grid-area:d;}
.e{grid-area:e;}
</style>
</head>

<body>

<div class="main">
<div class="box a">A</div>
<div class="box b">B</div>
<div class="box c">C</div>
<div class="box d">D</div>
<div class="box e">E</div>
</div>

</body>
</html>
